name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kotlin-python-ide

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK and release AAB
        run: gradle assembleDebug bundleRelease --no-daemon

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-python-ide-builds
          path: |
            kotlin-python-ide/app/build/outputs/apk/debug/app-debug.apk
            kotlin-python-ide/app/build/outputs/bundle/release/app-release.aab